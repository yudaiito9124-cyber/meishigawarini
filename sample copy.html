<style>
    /* 1. 全ての要素のサイズ計算を「枠線込み(border-box)」に固定して、はみ出しを防止 */
    .p-card-root,
    .p-card-root * {
        box-sizing: border-box !important;
    }

    .profile-card-embed-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: auto;
        /* 2. 背景が白くなるのを防ぐため、ここでもう一度黒を指定 */
        background-color: #050505;
        padding: 40px 0;
        line-height: 1.2;
        /* 行間の干渉をリセット */
    }

    /* 以下、カードのデザイン本体 */
    .p-card-root {
        --bg: #050505;
        --card-bg: #0a0a0a;
        --accent-blue: #3b82f6;
        --accent-green: #10b981;
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
        font-family: sans-serif;
    }

    .card-container {
        position: relative;
        width: 320px;
        height: 480px;
        padding: 2px;
        border-radius: 28px;
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .card-container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(transparent, var(--accent-blue), transparent 30%, transparent 50%, var(--accent-green), transparent 80%);
        animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .card {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border-radius: 26px;
        padding: 40px 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .eye-dot {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 6px;
        height: 6px;
        background: var(--accent-blue);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-blue);
        animation: scan 5s infinite;
    }

    @keyframes scan {

        0%,
        100% {
            transform: translate(0, 0);
            opacity: 0.3;
        }

        30% {
            transform: translate(-20px, 15px);
            opacity: 1;
        }

        60% {
            transform: translate(-10px, 40px);
            opacity: 0.6;
        }
    }

    .badge {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.2em;
        color: var(--accent-blue);
        border: 1px solid rgba(59, 130, 246, 0.3);
        padding: 4px 12px;
        border-radius: 100px;
        display: inline-block;
        margin: 0 auto;
        text-transform: uppercase;
    }

    .card h1 {
        color: var(--text-main);
        font-size: 28px;
        font-weight: 800;
        margin: 15px 0 5px;
        line-height: 1;
    }

    .affiliation {
        color: var(--text-dim);
        font-size: 12px;
        margin: 0 0 20px;
    }

    .section {
        text-align: left;
        margin-bottom: 15px;
    }

    .section-title {
        font-size: 10px;
        font-weight: 800;
        color: var(--text-dim);
        letter-spacing: 0.1em;
        margin: 0 0 6px;
        display: flex;
        align-items: center;
    }

    .section-title::before {
        content: '';
        width: 12px;
        height: 2px;
        background: var(--accent-blue);
        margin-right: 8px;
    }

    .section-title.green::before {
        background: var(--accent-green);
    }

    .section-content {
        color: var(--text-main);
        font-size: 13px;
        line-height: 1.6;
        margin: 0;
    }

    /* ボタンのはみ出し対策を徹底 */
    .button {
        display: block;
        width: 100%;
        /* box-sizing: border-boxのおかげで100%でもはみ出さない */
        padding: 16px;
        background: var(--text-main);
        color: #000 !important;
        text-decoration: none;
        border-radius: 14px;
        font-weight: 900;
        font-size: 14px;
        transition: 0.2s;
        border: none;
        cursor: pointer;
    }

    .social {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
    }

    .social a {
        color: var(--text-dim);
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
    }
</style>

<div class="profile-card-embed-wrapper p-card-root">
    <div class="card-container">
        <div class="card">
            <div class="eye-dot"></div>

            <div class="top-content">
                <div class="badge">Akita University</div>
                <h1>伊藤 悠大</h1>
                <p class="affiliation">研究者 / エンジニア</p>

                <div class="section">
                    <div class="section-title">Research</div>
                    <p class="section-content">視線計測とマルチモーダル解析による<br>人間の内部状態の推定研究。</p>
                </div>

                <div class="section">
                    <div class="section-title green">Project</div>
                    <p class="section-content">「MeishiGawarini」<br>QRコードによる次世代ギフト体験。</p>
                </div>
            </div>

            ※Gemini曰く※
            <div class="bottom-content">
                <a href="https://meishigawarini.com/" class="button">TRY OUR APP!</a>
                <div class="social">
                    <a href="#">GITHUB</a>
                    <a href="#">X / TWITTER</a>
                    <a href="#">PORTFOLIO</a>
                </div>
            </div>
        </div>
    </div>
</div>
